[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mergeweather"
version = "0.1.0"
description = "Explainable merge-conflict hotspot estimates from Git history"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
mergeweather = "mergeweather.cli:main"

[tool.setuptools.packages.find]
include = ["mergeweather*"]
